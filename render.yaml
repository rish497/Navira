services:
  - type: web
    name: navira
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: NAVIRA_AUTH_PEPPER
        generateValue: true
      - key: NAVIRA_STORE_NAMESPACE
        value: navira
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: YOLO_AUTO_MODEL
        value: qwen3.8-flash
      - key: YOLO_AUTO_API_KEY
        sync: false
